services:
  web:
    build: ./django_bnb_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_bnb_backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DATABASE=postgres
      - SQL_HOST=db
      - SQL_PORT=5432
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=djangobnb

volumes:
  postgres_data:
  static_volume:
  media_volume: